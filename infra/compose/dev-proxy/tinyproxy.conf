# Local stand-in for the residential proxy (architecture.md §10). Dev and tests only:
# PROXY_MAP points here (compose: http://dev-proxy:8888, host tests: http://127.0.0.1:18888).
# tinyproxy runs as a non-root user, so there is no User/Group; with no LogFile or Syslog it logs
# to stdout (`docker compose logs dev-proxy`). No StatHost and no BasicAuth.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 50

# Connect logs every request line ("Request (file descriptor N): GET http://… HTTP/1.1"), so a
# test or a developer can see which requests went through; refusals are logged as well.
LogLevel Connect

# The site must not learn that a proxy sits in between.
DisableViaHeader Yes

# Clients: the container itself (healthcheck), the compose default network (fixture sites;
# connections through the host-published port arrive from its gateway) and the browser network.
# Every private range, so KALKAN_SUBNET and BROWSER_SUBNET can move without editing this file;
# the port is published on 127.0.0.1 only, and the filter below still limits the targets.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Only the fixture sites (*.test) are reachable: anything else, the compose services by name or
# address included, gets 403 before tinyproxy resolves or connects to it.
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes

# CONNECT (https) only to 443; the fixture sites speak plain http.
ConnectPort 443
