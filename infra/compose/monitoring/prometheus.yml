# Local Prometheus for the monitoring profile (`make up-monitoring`; architecture.md §25). The
# VM's rules (vm/prometheus/rules) against the base stack's targets; a short evaluation interval
# so an alarm without `for` fires within seconds. Without ct-consumer NoCtEvents fires too.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: worker-default
    static_configs:
      - targets: ["worker-default:9191"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9400"]
