# Local Alertmanager for the monitoring profile: every alarm goes to Mailpit (http://localhost:8025),
# grouped by alarm as on the VM (vm/alertmanager/alertmanager.yml.tmpl) but without waiting.
global:
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alerts@kalkan.local'
  smtp_require_tls: false

route:
  receiver: ops-email
  group_by: ['alertname']
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 4h

receivers:
  - name: ops-email
    email_configs:
      - to: 'ops@kalkan.local'
        send_resolved: true
