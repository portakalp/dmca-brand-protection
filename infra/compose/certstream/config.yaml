# certstream-server-go for the local stack (`make up-ct`). Reference:
# https://github.com/d-Rickyy-b/certstream-server-go/blob/v1.10.1/config.sample.yaml
# The port is not published on the host; only ct-consumer connects, over the compose network.
webserver:
  listen_addr: "0.0.0.0"
  listen_port: 8080
  real_ip: false
  whitelist: []
  full_url: "/full-stream"
  lite_url: "/"
  domains_only_url: "/domains-only"
  cert_path: ""
  cert_key_path: ""
  compression_enabled: false

prometheus:
  enabled: true
  listen_addr: "0.0.0.0"
  listen_port: 8080
  metrics_url: "/metrics"
  expose_system_metrics: false
  real_ip: false
  whitelist: []

general:
  disable_default_logs: false
  drop_old_logs: true
  # Small buffers: a laptop does not need to keep up with a backlog.
  buffer_sizes:
    websocket: 300
    ctlog: 1000
    dispatcher: 10000
  # Start from the current position of each log instead of downloading history.
  recovery:
    enabled: false
