# Prometheus on the VM (architecture.md §23; K83, K173). Alert rules in rules/*.yml (tests:
# tests/kalkan_test.yml, `make infra-check`).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Dramatiq's Prometheus exporter (K33, K60).
  - job_name: worker-default
    static_configs:
      - targets: ["worker-default:9191"]

  # ai_cost_usd_total and ai_budget_stops_total (profile ai).
  - job_name: worker-ai
    static_configs:
      - targets: ["worker-ai:9191"]

  # Queue depths, open tasks, cases, notices and AI spend read from Redis and the database at
  # every scrape (kalkan.monitoring.exporter).
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9400"]

  # The VM's disk, memory and CPU.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # On the browser network (172.31.250.11), through Prometheus's leg there (172.31.250.12); the
  # only connection vm/bin/firewall.sh lets into worker-browser. Captures, proxy bytes and the
  # fail-closed deferrals (captures_total, proxy_bytes_total, capture_deferrals_total).
  # The browser is untrusted: an oversized scrape fails (up=0) instead of growing Prometheus.
  - job_name: worker-browser
    sample_limit: 2000
    label_limit: 30
    label_name_length_limit: 128
    label_value_length_limit: 512
    body_size_limit: 2MB
    static_configs:
      - targets: ["worker-browser:9191"]

  - job_name: ct-consumer
    static_configs:
      - targets: ["ct-consumer:9300"]

  - job_name: certstream
    metrics_path: /metrics
    static_configs:
      - targets: ["certstream:8080"]
