# Self-hosted Prometheus (profile monitoring). The reference VM's alert rules and Grafana
# dashboards (infra/compose/vm) are mounted as they are; only the targets differ.
# Services behind other profiles (worker-ai, worker-browser, ct-consumer, certstream) are found
# by DNS: while a profile is off its name does not resolve, the job has no target and TargetDown
# stays quiet. NoCtEvents fires while the ct profile is off (no CT events at all).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Dramatiq's Prometheus exporter.
  - job_name: worker-default
    static_configs:
      - targets: ["worker-default:9191"]

  # Queue depths, open tasks, cases, notices and AI spend (kalkan.monitoring.exporter).
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9400"]

  # The server's disk, memory and CPU.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: worker-ai
    dns_sd_configs:
      - names: ["worker-ai"]
        type: A
        port: 9191

  # Reached over the browser-metrics network, which only Prometheus and worker-browser join.
  # The browser is untrusted: an oversized scrape fails (up=0) instead of growing Prometheus.
  - job_name: worker-browser
    sample_limit: 2000
    label_limit: 30
    label_name_length_limit: 128
    label_value_length_limit: 512
    body_size_limit: 2MB
    dns_sd_configs:
      - names: ["worker-browser"]
        type: A
        port: 9191

  - job_name: ct-consumer
    dns_sd_configs:
      - names: ["ct-consumer"]
        type: A
        port: 9300

  - job_name: certstream
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["certstream"]
        type: A
        port: 8080
