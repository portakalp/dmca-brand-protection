# Fixture sites for scanning tests (architecture.md §25). All brands and names are fictional.
# Inside compose they answer as *.test on 172.30.255.80; tests on the host use 127.0.0.1:18080.
server {
    listen 80 default_server;
    return 404;
}

# The official Mintera Bank site.
server {
    listen 80;
    server_name mintera.test www.mintera.test;
    root /sites/official;
}

# A clone: same look and favicon, login, password and card fields.
server {
    listen 80;
    server_name mintera-login.test;
    root /sites/clone;
}

# A parked, for-sale page.
server {
    listen 80;
    server_name mintera-parked.test;
    root /sites/parked;
}

# An almost empty page.
server {
    listen 80;
    server_name mintera-empty.test;
    root /sites/empty;
}

# A look-alike that sends visitors to the official site.
server {
    listen 80;
    server_name mintera-redirect.test;
    return 302 http://mintera.test$request_uri;
}

# Different content for phones: a recipe blog on desktop, a clone on mobile.
server {
    listen 80;
    server_name mintera-mobile.test;
    root /sites/mobile;
    location = / {
        if ($http_user_agent ~* "(iphone|android|mobile)") {
            rewrite ^ /m.html last;
        }
        try_files /index.html =404;
    }
}

# A bot challenge page, the way Cloudflare serves one.
server {
    listen 80;
    server_name mintera-challenge.test;
    root /sites/challenge;
    error_page 403 /challenge.html;
    location = /challenge.html {
        internal;
        add_header cf-mitigated challenge always;
    }
    location / {
        return 403;
    }
}

# A lure page (a fake "new sign-in address" notice) whose buttons lead to the clone and elsewhere.
server {
    listen 80;
    server_name mintera-verify.test;
    root /sites/lure;
}

# An affiliate review that links to the official site.
server {
    listen 80;
    server_name mintera-review.test;
    root /sites/affiliate;
}

# An endless redirect loop (/ -> /loop -> / ...); /js navigates to itself from JavaScript forever.
server {
    listen 80;
    server_name mintera-loop.test;
    root /sites/loop;
    location = /js {
        try_files /js.html =404;
    }
    location = /loop {
        return 302 http://mintera-loop.test/;
    }
    location / {
        return 302 http://mintera-loop.test/loop;
    }
}

# A heavy page: about 30,000 px tall, 60 images (most lazy-loaded), 250 links and a video.
server {
    listen 80;
    server_name mintera-heavy.test;
    root /sites/heavy;
    # The browser aborts media requests (architecture.md §10). A tiny placeholder answers here, so
    # a missed abort shows up as a completed request (HAR, dev-proxy log) instead of a hang.
    location /media/ {
        default_type video/mp4;
        return 200 "placeholder";
    }
}
