<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mintera Bank - Personal and business banking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico"><style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fa;color:#13263b}
header{display:flex;align-items:center;gap:24px;padding:14px 24px;background:#0b2a4a;color:#fff}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo span{color:#0f9d8a}
nav{display:flex;gap:16px;color:#c9d6e3;font-size:14px}
.banner{margin:24px;padding:28px;border-radius:14px;background:linear-gradient(120deg,#0f9d8a,#0b2a4a);color:#fff}
.banner b{display:block;font-size:22px;margin-bottom:6px}
form{margin:24px;max-width:360px;padding:20px;border-radius:12px;background:#fff;border:1px solid #d7e0ea}
label{display:block;margin:10px 0 4px;font-size:13px;color:#4a5d72}
input{box-sizing:border-box;width:100%;padding:10px;border-radius:8px;border:1px solid #b9c7d6;background:#fff;color:#13263b}
button,.btn{display:inline-block;margin-top:14px;padding:11px 18px;border:0;border-radius:8px;background:#0f9d8a;color:#fff;font-weight:700;text-decoration:none}
footer{margin:24px;font-size:12px;color:#5b6b7d}
</style></head>
<body><header><div class="logo">Mintera<span>Bank</span></div>
<nav><span>Accounts</span><span>Cards</span><span>Loans</span><span>Business</span></nav></header>
<section class="banner"><b>Your card, anywhere</b>Manage your account and card today from secure online banking.</section>
<form action="/session" method="post"><b>Sign in to Mintera Bank</b>
<label for="email">E-mail</label><input id="email" type="email" name="email" autocomplete="username">
<label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password">
<label for="customer">Customer number</label><input id="customer" type="text" name="customer" autocomplete="off" placeholder="8 digits">
<button type="submit">Sign in</button></form>
<footer>Mintera Bank, a test brand. Deposits are protected up to the legal limit.</footer></body></html>
