<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Top up</title></head><body>
<h1>Top up your account</h1>
<form action="https://pay.example-gateway.test/charge" method="post">
  <label>Amount <input name="amount" type="number"></label>
  <label>Card number <input name="cc" inputmode="numeric" placeholder="1234 5678 9012 3456"></label>
  <label>Expiry <input name="exp" placeholder="MM/YY"></label>
  <label>CVV <input name="cvc" maxlength="4"></label>
  <button>Deposit now</button>
</form></body></html>
