{% extends "base.html" %}
{% block title %}Code · Kalkan ops{% endblock %}
{% block content %}
<section class="narrow card">
  <h1>Authenticator code</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/totp" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>6-digit code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required autofocus></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted"><a href="/login">Start again</a></p>
</section>
{% endblock %}
