{% extends "base.html" %}
{% block title %}Sign in · Kalkan ops{% endblock %}
{% block content %}
<section class="narrow card">
  <h1>Sign in</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <label>E-mail <input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
