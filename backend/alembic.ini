# Alembic configuration. The database URL comes from DATABASE_URL_MIGRATE (kalkan_owner);
# see alembic/env.py. Run from backend/: uv run alembic upgrade head (or `make migrate`).
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
